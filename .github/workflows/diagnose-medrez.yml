name: Diagnose Medrez Page Structure

on:
  workflow_dispatch: # Manual trigger only — run from the Actions tab.

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/sync-residents/package.json

      - name: Install dependencies
        working-directory: scripts/sync-residents
        run: npm install

      - name: Run diagnostic
        working-directory: scripts/sync-residents
        run: node diagnose.js

      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medrez-diagnostic
          path: |
            scripts/sync-residents/diag-*.html
            scripts/sync-residents/diag-*.png
            scripts/sync-residents/diag-*.json
          if-no-files-found: warn
          retention-days: 7
