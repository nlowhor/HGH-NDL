name: Sync Student Photos from Airtable

on:
  schedule:
    # Runs daily at 6 AM Pacific (14:00 UTC).
    - cron: '0 14 * * *'
  workflow_dispatch: # Allow manual trigger from Actions tab.

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/sync-students/package.json

      - name: Install dependencies
        working-directory: scripts/sync-students
        run: npm install

      - name: Run student photo sync
        working-directory: scripts/sync-students
        env:
          CANONICAL_SHEET_ID:          ${{ secrets.CANONICAL_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node index.js

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: airtable-debug
          path: |
            scripts/sync-students/airtable-debug.png
            scripts/sync-students/airtable-debug.html
          if-no-files-found: ignore
          retention-days: 7
