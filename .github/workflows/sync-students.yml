name: Sync Student Schedule and Photos

on:
  schedule:
    # Daily sync at 6 AM Pacific (14:00 UTC).
    - cron: '0 14 * * *'
    # Weekly photo refresh every Sunday — FORCE_PHOTO_REFRESH is set
    # based on which schedule triggered the run (see step env below).
    - cron: '0 14 * * 0'
  workflow_dispatch:

permissions:
  contents: write  # Required to commit headshots to the repo via GitHub API.

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/sync-students/package.json

      - name: Install dependencies
        working-directory: scripts/sync-students
        run: npm install

      - name: Run student sync
        working-directory: scripts/sync-students
        env:
          CANONICAL_SHEET_ID:           ${{ secrets.CANONICAL_SHEET_ID }}
          STUDENT_SCHEDULE_SHEET_ID:    ${{ secrets.STUDENT_SCHEDULE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON:  ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          AIRTABLE_API_KEY:             ${{ secrets.AIRTABLE_API_KEY }}
          # Optional: set to table name or ID to skip metadata API discovery.
          # Required if your token lacks the schema.bases:read scope.
          AIRTABLE_TABLE:               ${{ secrets.AIRTABLE_TABLE }}
          # GitHub API credentials for committing headshots to GitHub Pages.
          GITHUB_TOKEN:                 ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY:            ${{ github.repository }}
          GITHUB_REF_NAME:              ${{ github.ref_name }}
          # Force re-download of all photos on the Sunday run.
          FORCE_PHOTO_REFRESH:          ${{ github.event.schedule == '0 14 * * 0' && 'true' || '' }}
        run: node index.js
