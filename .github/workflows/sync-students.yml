name: Sync Student Schedule (DEV)

# Dev sync — runs against the dev Google Sheet and commits to the dev branch.
# Triggered manually only; scheduled syncs run from the live branch.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/sync-students/package.json

      - name: Install dependencies
        working-directory: scripts/sync-students
        run: npm install

      - name: Run student sync
        working-directory: scripts/sync-students
        env:
          CANONICAL_SHEET_ID:           ${{ secrets.DEV_CANONICAL_SHEET_ID }}
          STUDENT_SCHEDULE_SHEET_ID:    ${{ secrets.STUDENT_SCHEDULE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON:  ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node index.js
