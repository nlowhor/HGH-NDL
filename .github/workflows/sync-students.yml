name: Sync Student Schedule and Photos

on:
  schedule:
    # Runs daily at 6 AM Pacific (14:00 UTC).
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/sync-students/package.json

      - name: Install dependencies
        working-directory: scripts/sync-students
        run: npm install

      - name: Show service account email
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: echo "$GOOGLE_SERVICE_ACCOUNT_JSON" | node -e "process.stdout.write(require('fs').readFileSync('/dev/stdin','utf8'))" | node -e "const d=require('fs').readFileSync('/dev/stdin','utf8'); console.log('SA email:', JSON.parse(d).client_email)"

      - name: Run student sync
        working-directory: scripts/sync-students
        env:
          CANONICAL_SHEET_ID:           ${{ secrets.CANONICAL_SHEET_ID }}
          STUDENT_SCHEDULE_SHEET_ID:    ${{ secrets.STUDENT_SCHEDULE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON:  ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          AIRTABLE_API_KEY:             ${{ secrets.AIRTABLE_API_KEY }}
          # Optional: set to table name or ID to skip metadata API discovery.
          # Required if your token lacks the schema.bases:read scope.
          AIRTABLE_TABLE:               ${{ secrets.AIRTABLE_TABLE }}
          # Drive folder for persistent headshot storage (avoids Airtable CDN expiry).
          DRIVE_FOLDER_ID:              ${{ secrets.DRIVE_FOLDER_ID }}
        run: node index.js
