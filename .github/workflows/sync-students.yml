name: Sync Student Schedule

on:
  schedule:
    - cron: '0 14 * * *'  # Daily at 6 AM Pacific (14:00 UTC)
  workflow_dispatch:        # Allow manual trigger from Actions tab

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/next-dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/sync-students/package.json

      - name: Install dependencies
        working-directory: scripts/sync-students
        run: npm install

      - name: Run student sync
        working-directory: scripts/sync-students
        env:
          CANONICAL_SHEET_ID:          ${{ secrets.CANONICAL_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node index.js
