name: Deploy to GitHub Pages

on:
  push:
    branches:
      - live
  # The sync workflows commit data/sync-status-*.json using secrets.GITHUB_TOKEN.
  # GitHub deliberately does not start new workflow runs from events created with
  # GITHUB_TOKEN, so those commits never trigger a deploy — without this schedule
  # the live site only refreshes when a human pushes, and the footer's freshness
  # timestamps go stale even while the syncs are succeeding.
  schedule:
    - cron: '0 15 * * *'  # Daily at 8:00 AM Pacific, after the three morning syncs
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
