name: Sync Person Tabs (photos and titles only)

on:
  workflow_dispatch: # Manual trigger only — does NOT touch the roster schedule.

permissions:
  contents: write

jobs:
  sync-residents-persons:
    name: Residents person tab
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/sync-residents/package.json

      - name: Install dependencies
        working-directory: scripts/sync-residents
        run: npm install

      - name: Update residents person tab
        working-directory: scripts/sync-residents
        env:
          CANONICAL_SHEET_ID:          ${{ secrets.CANONICAL_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          AIRTABLE_API_KEY:            ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_RESIDENTS_BASE_ID:  ${{ secrets.AIRTABLE_RESIDENTS_BASE_ID }}
          GITHUB_TOKEN:                ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY:           ${{ github.repository }}
          GITHUB_REF_NAME:             ${{ github.ref_name }}
          PERSON_TAB_ONLY:             'true'
        run: node index.js

  sync-students-persons:
    name: Students person tab
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/sync-students/package.json

      - name: Install dependencies
        working-directory: scripts/sync-students
        run: npm install

      - name: Update students person tab
        working-directory: scripts/sync-students
        env:
          CANONICAL_SHEET_ID:           ${{ secrets.CANONICAL_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON:  ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          AIRTABLE_API_KEY:             ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_TABLE:               ${{ secrets.AIRTABLE_TABLE }}
          GITHUB_TOKEN:                 ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY:            ${{ github.repository }}
          GITHUB_REF_NAME:              ${{ github.ref_name }}
          PERSON_TAB_ONLY:              'true'
        run: node index.js
