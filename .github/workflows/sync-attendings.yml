name: Sync Attendings from QGenda (DEV)

# Dev sync — runs against the dev Google Sheet and commits to the dev branch.
# Triggered manually only; scheduled syncs run from the live branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/sync-attendings/package.json

      - name: Install dependencies
        working-directory: scripts/sync-attendings
        run: npm install

      - name: Run attending sync
        working-directory: scripts/sync-attendings
        env:
          CANONICAL_SHEET_ID:          ${{ secrets.DEV_CANONICAL_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GITHUB_TOKEN:                ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY:           ${{ github.repository }}
          GITHUB_REF_NAME:             dev
          FORCE_PHOTO_REFRESH:         ''
        run: node index.js

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attending-sync-debug-dev
          path: |
            scripts/sync-attendings/qgenda-debug.png
            scripts/sync-attendings/qgenda-debug.html
            scripts/sync-attendings/qgenda-debug.txt
            scripts/sync-attendings/faculty-debug.png
            scripts/sync-attendings/faculty-debug.html
          if-no-files-found: ignore
          retention-days: 7
