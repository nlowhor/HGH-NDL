name: Sync Residents from Medrez (DEV)

# Dev sync — runs against the dev Google Sheet and commits to the dev branch.
# Triggered manually only; scheduled syncs run from the live branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/sync-residents/package.json

      - name: Install dependencies
        working-directory: scripts/sync-residents
        run: npm install

      - name: Run resident sync
        working-directory: scripts/sync-residents
        env:
          CANONICAL_SHEET_ID:          ${{ secrets.DEV_CANONICAL_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          AIRTABLE_API_KEY:            ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_RESIDENTS_BASE_ID:  ${{ secrets.AIRTABLE_RESIDENTS_BASE_ID }}
          GITHUB_TOKEN:                ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY:           ${{ github.repository }}
          GITHUB_REF_NAME:             dev
          FORCE_PHOTO_REFRESH:         ''
        run: node index.js

      - name: Upload debug screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medrez-debug-dev
          path: scripts/sync-residents/medrez-debug.png
          if-no-files-found: ignore
          retention-days: 7
