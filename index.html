<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HGH Emergency Department</title>
  <link rel="stylesheet" href="styles.css?v=30" />
</head>
<body>
  <main>
    <section id="shift-section" class="shift-section">
      <div class="shift-section__head">
        <div id="shift-meta" class="shift-section__meta"></div>
        <div id="shift-relative" class="shift-section__label"></div>
        <div class="shift-section__head-right">
          <nav class="shift-nav" aria-label="Shift navigation">
            <button id="prev-shift-btn" class="shift-nav__btn">&#8592; Prev</button>
            <button id="current-btn" class="shift-nav__btn">Current</button>
            <button id="upnext-btn" class="shift-nav__btn">Up Next</button>
            <input type="datetime-local" id="when" class="shift-nav__when" />
            <button id="next-shift-btn" class="shift-nav__btn">Next &#8594;</button>
          </nav>
        </div>
      </div>
      <div class="roles">
        <h3 class="role-header">Residents</h3>
        <h3 class="role-header">Students</h3>
        <h3 class="role-header">Attendings</h3>
        <div class="cards" data-target="shift.resident"></div>
        <div class="cards" data-target="shift.student"></div>
        <div class="cards" data-target="shift.attending"></div>
      </div>
    </section>
  </main>

  <script type="module" src="js/app.js?v=38"></script>
</body>
</html>
